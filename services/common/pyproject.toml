[project]
name = "racestream-common"
version = "0.1.0"
description = "Shared contracts, configuration, observability and transport for RaceStream services."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "aiokafka>=0.10",
    "asyncpg>=0.29",
    "orjson>=3.10",
    # aiokafka routes LZ4/Snappy/Zstd through cramjam, not the `lz4` package.
    "cramjam>=2.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["racestream_common*"]
