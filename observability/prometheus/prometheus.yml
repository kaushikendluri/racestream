# Scrape config. Targets are compose service names on the racestream network.
global:
  scrape_interval: 5s          # matches the dashboard's finest resolution
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    stack: racestream

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Redpanda exports Kafka-level metrics (partition high-watermarks, group
  # offsets) that complement the application-level lag gauge.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  # The API serves its metrics from the same port as the REST surface, so there
  # is no second listener to keep alive.
  # No `component` label is attached here on purpose. RaceStream metrics carry
  # their own `component` label, and a target label of the same name would win,
  # pushing the real value to `exported_component` and silently breaking every
  # query that groups by component. `job` already identifies the service.
  - job_name: racestream-api
    static_configs:
      - targets: ["api:8000"]

  # Ingestion, processor and replay are added here as each service lands. A
  # permanently-red target teaches people to ignore red targets, so a job is
  # only listed once the thing it scrapes exists.
